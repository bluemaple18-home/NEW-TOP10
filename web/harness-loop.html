<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOP10 Harness Loop</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #617089;
        --grid: #d9e2ec;
        --daily: #2368d9;
        --research: #7a4cc2;
        --safety: #24824b;
        --ops: #a66a16;
        --stop: #c7463f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        min-width: 2460px;
        padding: 22px 0 30px;
      }

      header {
        width: 2400px;
        margin: 0 auto 14px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 28px;
      }

      h1 {
        margin: 0;
        font-size: 27px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 8px 0 0;
        max-width: 1160px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
        line-height: 1.55;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        max-width: 900px;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--grid);
        border-radius: 7px;
        background: var(--panel);
        padding: 7px 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
        white-space: nowrap;
      }

      .swatch {
        width: 24px;
        height: 4px;
        border-radius: 99px;
        background: var(--daily);
      }

      .swatch.research {
        background: var(--research);
      }

      .swatch.safety {
        background: var(--safety);
      }

      .swatch.ops {
        background: var(--ops);
      }

      .swatch.stop {
        background: var(--stop);
      }

      .frame {
        width: 2400px;
        height: 1050px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #ccd7e3;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 18px 46px rgba(23, 32, 51, 0.12);
      }

      svg {
        width: 2400px;
        height: 1050px;
        display: block;
      }

      .lane {
        fill: #f8fafc;
      }

      .lane.alt {
        fill: #ffffff;
      }

      .lane-line {
        stroke: var(--grid);
        stroke-width: 1;
      }

      .lane-title {
        font-size: 14px;
        font-weight: 950;
        letter-spacing: 0.02em;
      }

      .edge {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .edge.daily {
        stroke: var(--daily);
      }

      .edge.research {
        stroke: var(--research);
      }

      .edge.safety {
        stroke: var(--safety);
      }

      .edge.ops {
        stroke: var(--ops);
      }

      .edge.stop {
        stroke: var(--stop);
      }

      .edge.main {
        stroke-width: 5.5;
      }

      .edge.secondary {
        stroke-width: 3.6;
      }

      .edge.dashed {
        stroke-dasharray: 9 8;
      }

      .edge-label {
        font-size: 12px;
        font-weight: 950;
        paint-order: stroke;
        stroke: #fff;
        stroke-width: 6px;
        stroke-linejoin: round;
      }

      .port {
        stroke: #fff;
        stroke-width: 2.2;
      }

      .card rect.shell {
        fill: #fff;
        stroke: #c5d2df;
        stroke-width: 1.35;
        rx: 7;
        filter: drop-shadow(0 7px 13px rgba(23, 32, 51, 0.08));
      }

      .card rect.bar {
        stroke: none;
        rx: 7;
      }

      .card-title {
        fill: var(--ink);
        font-size: 13.5px;
        font-weight: 950;
      }

      .card-body {
        fill: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .pill-bg {
        fill: #eef3f8;
        rx: 5;
      }

      .pill {
        fill: #4e5b71;
        font-size: 10px;
        font-weight: 950;
      }

      .callout {
        fill: #fffaf0;
        stroke: #d4b47d;
        stroke-width: 1.2;
        rx: 7;
      }

      .callout-title {
        fill: #7c4f10;
        font-size: 13px;
        font-weight: 950;
      }

      .callout-body {
        fill: #725c39;
        font-size: 11px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>TOP10 Harness Loop：14 隻機器人正式流程</h1>
          <p class="subtitle">
            左到右是實際 handoff：17:30 daily 產報牌，17:50 external review 接手，Fog Map 挑研究隊列，Research Worker 跑 quota，再回到 Fog Map 與工作進度頻道。報牌頻道與工作進度頻道分開，不再是兩套排程。
          </p>
        </div>
        <div class="legend" aria-label="圖例">
          <span><i class="swatch"></i>每日主線</span>
          <span><i class="swatch research"></i>研究回圈</span>
          <span><i class="swatch safety"></i>驗證 / 後驗</span>
          <span><i class="swatch ops"></i>工作進度</span>
          <span><i class="swatch stop"></i>停止 / fail-loud</span>
        </div>
      </header>

      <section class="frame">
        <svg id="diagram" viewBox="0 0 2400 1050" role="img" aria-labelledby="title desc">
          <title id="title">TOP10 harness horizontal workflow</title>
          <desc id="desc">14 個正式 agent 的左到右流程圖，所有線都連到卡片 port。</desc>

          <defs>
            <marker id="arrow-daily" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
              <path d="M 0 0 L 12 6 L 0 12 z" fill="#2368d9"></path>
            </marker>
            <marker id="arrow-research" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
              <path d="M 0 0 L 12 6 L 0 12 z" fill="#7a4cc2"></path>
            </marker>
            <marker id="arrow-safety" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
              <path d="M 0 0 L 12 6 L 0 12 z" fill="#24824b"></path>
            </marker>
            <marker id="arrow-ops" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
              <path d="M 0 0 L 12 6 L 0 12 z" fill="#a66a16"></path>
            </marker>
            <marker id="arrow-stop" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
              <path d="M 0 0 L 12 6 L 0 12 z" fill="#c7463f"></path>
            </marker>
          </defs>

          <rect class="lane" x="0" y="0" width="2400" height="172"></rect>
          <rect class="lane alt" x="0" y="172" width="2400" height="252"></rect>
          <rect class="lane" x="0" y="424" width="2400" height="278"></rect>
          <rect class="lane alt" x="0" y="702" width="2400" height="348"></rect>
          <line class="lane-line" x1="0" y1="172" x2="2400" y2="172"></line>
          <line class="lane-line" x1="0" y1="424" x2="2400" y2="424"></line>
          <line class="lane-line" x1="0" y1="702" x2="2400" y2="702"></line>

          <text class="lane-title" x="28" y="44" fill="#a66a16">OPS STATUS LOOP</text>
          <text class="lane-title" x="28" y="216" fill="#2368d9">DAILY RANKING LOOP</text>
          <text class="lane-title" x="28" y="468" fill="#7a4cc2">EXTERNAL REVIEW + RESEARCH LOOP</text>
          <text class="lane-title" x="28" y="748" fill="#24824b">EVIDENCE / FEEDBACK LOOP</text>

          <g id="edges"></g>
          <g id="ports"></g>
          <g id="cards"></g>

          <rect class="callout" x="64" y="884" width="455" height="86"></rect>
          <text class="callout-title" x="84" y="914">排程口徑</text>
          <text class="callout-body" x="84" y="938">17:30：daily/publish。17:50：external review → Fog Map → Research Worker → Ops。</text>
          <text class="callout-body" x="84" y="958">Fog Map / research quota 不另開第二套 launchd。</text>

          <rect class="callout" x="560" y="884" width="470" height="86"></rect>
          <text class="callout-title" x="580" y="914">防空跑條件</text>
          <text class="callout-body" x="580" y="938">每一段都寫 top10-agent-status-event；失敗、跳過、pending 都會進 dashboard。</text>
          <text class="callout-body" x="580" y="958">研究只能進 evidence / queue，不能直接改 ranking。</text>
        </svg>
      </section>
    </main>

    <script>
      const colors = {
        daily: "#2368d9",
        research: "#7a4cc2",
        safety: "#24824b",
        ops: "#a66a16",
        stop: "#c7463f",
      };

      const nodes = [
        { id: "harness", x: 70, y: 250, w: 142, h: 112, kind: "daily", title: "1. Harness", body: ["建立 run_id", "lock / retry / timeout"], tag: "17:30 daily" },
        { id: "preflight", x: 250, y: 250, w: 142, h: 112, kind: "daily", title: "2. Preflight", body: ["交易日 / API", "前輪 blocker"], tag: "pass / skip" },
        { id: "etl", x: 430, y: 250, w: 142, h: 112, kind: "daily", title: "3. ETL", body: ["TWSE / TPEX", "籌碼 / 基本面"], tag: "snapshot" },
        { id: "quality", x: 610, y: 250, w: 142, h: 112, kind: "safety", title: "4. Data Gate", body: ["日期 / 筆數", "缺值 / 覆蓋率"], tag: "quality" },
        { id: "ranking", x: 790, y: 250, w: 142, h: 112, kind: "daily", title: "5. Ranking", body: ["每日 Top10", "分數 / 理由"], tag: "top10" },
        { id: "circuit", x: 970, y: 250, w: 142, h: 112, kind: "safety", title: "6. Circuit", body: ["劇烈變動", "baseline 偏離"], tag: "stop/degrade" },
        { id: "push", x: 1150, y: 250, w: 142, h: 112, kind: "daily", title: "7. Daily Push", body: ["只推 Top10", "附 run_id"], tag: "#top10-daily" },
        { id: "dailyChannel", x: 1330, y: 250, w: 154, h: 112, kind: "daily", title: "報牌頻道", body: ["原本每天報牌", "不收研究過程"], tag: "Discord" },
        { id: "outcome", x: 1522, y: 250, w: 142, h: 112, kind: "safety", title: "8. Outcome", body: ["命中 / 報酬", "誤報 / 人工標記"], tag: "後驗" },

        { id: "external", x: 1522, y: 520, w: 142, h: 112, kind: "ops", title: "9. Review", body: ["17:50 接手", "verified packet"], tag: "external" },
        { id: "adapter", x: 1702, y: 520, w: 142, h: 112, kind: "research", title: "10. AI Adapter", body: ["ChatGPT", "Gemini"], tag: "dual AI" },
        { id: "disagree", x: 1882, y: 520, w: 142, h: 112, kind: "safety", title: "11. Disagree", body: ["誰完全不對", "反證 / 隔離"], tag: "next actions" },
        { id: "fog", x: 2062, y: 520, w: 142, h: 112, kind: "research", title: "12. Fog Map", body: ["研究中控", "挑未知區"], tag: "queue" },
        { id: "worker", x: 2062, y: 762, w: 142, h: 112, kind: "research", title: "13. Worker", body: ["研究 quota", "安全回測"], tag: "no ranking" },

        { id: "ops", x: 2062, y: 48, w: 142, h: 112, kind: "ops", title: "14. Ops", body: ["進度 / blocker", "外部 AI 差異"], tag: "#top10-ops" },
        { id: "opsChannel", x: 2242, y: 48, w: 128, h: 112, kind: "ops", title: "工作進度", body: ["今天卡在哪", "下一步"], tag: "Discord" },

        { id: "stop", x: 610, y: 48, w: 142, h: 112, kind: "stop", title: "Stop Event", body: ["失敗 / 跳過", "不假裝完成"], tag: "fail-loud" },
      ];

      const edges = [
        { from: "harness", to: "preflight", kind: "daily", label: "run request", route: "straight" },
        { from: "preflight", to: "etl", kind: "daily", label: "pass", route: "straight" },
        { from: "etl", to: "quality", kind: "daily", route: "straight" },
        { from: "quality", to: "ranking", kind: "daily", route: "straight" },
        { from: "ranking", to: "circuit", kind: "daily", route: "straight" },
        { from: "circuit", to: "push", kind: "daily", label: "ok", route: "straight" },
        { from: "push", to: "dailyChannel", kind: "daily", label: "只到報牌頻道", route: "straight" },
        { from: "dailyChannel", to: "outcome", kind: "safety", label: "後驗", route: "straight" },

        { from: "outcome", to: "external", kind: "ops", label: "daily OK 後 17:50", route: "verticalDown" },
        { from: "external", to: "adapter", kind: "research", route: "straight" },
        { from: "adapter", to: "disagree", kind: "research", route: "straight" },
        { from: "disagree", to: "fog", kind: "research", route: "straight" },
        { from: "outcome", to: "fog", kind: "safety", label: "後驗訊號", route: "busToFog", laneY: 448 },
        { from: "circuit", to: "fog", kind: "safety", label: "異常訊號", route: "busToFog", laneY: 408, dashed: true },

        { from: "fog", to: "worker", kind: "research", label: "挑 quota", route: "verticalDown" },
        { from: "worker", to: "fog", kind: "research", label: "run history 回填", route: "loopBack", dashed: true },

        { from: "fog", to: "ops", kind: "ops", label: "迷霧 / 研究進度", route: "upToOps" },
        { from: "external", to: "ops", kind: "ops", label: "host status", route: "upToOps", dashed: true },
        { from: "worker", to: "ops", kind: "ops", label: "quota fail / done", route: "upToOps", dashed: true },
        { from: "ops", to: "opsChannel", kind: "ops", label: "回報工作進度", route: "straight" },
        { from: "opsChannel", to: "harness", kind: "ops", label: "下一輪 blocker", route: "outerLoop", dashed: true },

        { from: "preflight", to: "stop", kind: "stop", label: "skip/fail", route: "stopUp", dashed: true },
        { from: "quality", to: "stop", kind: "stop", label: "資料不可信", route: "stopUp", dashed: true },
        { from: "circuit", to: "stop", kind: "stop", label: "不可解釋", route: "stopUp", dashed: true },
        { from: "stop", to: "ops", kind: "stop", label: "停止摘要", route: "topBus" },
      ];

      const svg = document.getElementById("diagram");
      const edgeLayer = document.getElementById("edges");
      const portLayer = document.getElementById("ports");
      const cardLayer = document.getElementById("cards");
      const nodeById = Object.fromEntries(nodes.map((node) => [node.id, node]));

      function point(node, side) {
        const cx = node.x + node.w / 2;
        const cy = node.y + node.h / 2;
        if (side === "left") return { x: node.x, y: cy };
        if (side === "right") return { x: node.x + node.w, y: cy };
        if (side === "top") return { x: cx, y: node.y };
        return { x: cx, y: node.y + node.h };
      }

      function route(edge) {
        const a = nodeById[edge.from];
        const b = nodeById[edge.to];
        if (edge.route === "straight") return [point(a, "right"), point(b, "left")];
        if (edge.route === "verticalDown") return [point(a, "bottom"), point(b, "top")];
        if (edge.route === "loopBack") {
          const start = point(a, "left");
          const end = point(b, "bottom");
          return [start, { x: start.x - 70, y: start.y }, { x: start.x - 70, y: end.y + 28 }, { x: end.x, y: end.y + 28 }, end];
        }
        if (edge.route === "busToFog") {
          const start = point(a, "bottom");
          const end = point(b, "left");
          const y = edge.laneY;
          return [start, { x: start.x, y }, { x: end.x - 36, y }, { x: end.x - 36, y: end.y }, end];
        }
        if (edge.route === "upToOps") {
          const start = point(a, "top");
          const end = point(b, "bottom");
          const x = start.x + (a.id === "worker" ? 64 : -38);
          return [start, { x: start.x, y: 430 }, { x, y: 430 }, { x, y: end.y + 34 }, { x: end.x, y: end.y + 34 }, end];
        }
        if (edge.route === "stopUp") {
          const start = point(a, "top");
          const end = point(b, "bottom");
          const y = 190;
          return [start, { x: start.x, y }, { x: end.x, y }, end];
        }
        if (edge.route === "topBus") {
          const start = point(a, "right");
          const end = point(b, "left");
          return [start, { x: 1030, y: start.y }, { x: 1030, y: end.y }, end];
        }
        if (edge.route === "outerLoop") {
          const start = point(a, "left");
          const end = point(b, "top");
          return [start, { x: start.x - 42, y: 30 }, { x: 92, y: 30 }, { x: 92, y: end.y - 28 }, end];
        }
        return [point(a, "right"), point(b, "left")];
      }

      function addSvg(name, attrs, parent = svg) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
        parent.appendChild(el);
        return el;
      }

      function pathData(points) {
        return points.map((p, index) => `${index === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
      }

      function labelPoint(points) {
        const index = Math.floor((points.length - 1) / 2);
        const a = points[index];
        const b = points[Math.min(points.length - 1, index + 1)];
        return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 8 };
      }

      edges.forEach((edge) => {
        const points = route(edge);
        const cls = ["edge", edge.kind, edge.dashed ? "dashed" : "", edge.kind === "daily" || edge.kind === "research" ? "main" : "secondary"].join(" ");
        addSvg("path", {
          class: cls,
          d: pathData(points),
          "marker-end": `url(#arrow-${edge.kind})`,
        }, edgeLayer);

        const start = points[0];
        const end = points[points.length - 1];
        addSvg("circle", { class: "port", cx: start.x, cy: start.y, r: 4.6, fill: colors[edge.kind] }, portLayer);
        addSvg("circle", { class: "port", cx: end.x, cy: end.y, r: 4.6, fill: colors[edge.kind] }, portLayer);

        if (edge.label) {
          const p = labelPoint(points);
          const label = addSvg("text", { class: "edge-label", x: p.x, y: p.y, fill: colors[edge.kind], "text-anchor": "middle" }, edgeLayer);
          label.textContent = edge.label;
        }
      });

      nodes.forEach((node) => {
        const g = addSvg("g", { class: "card", transform: `translate(${node.x} ${node.y})` }, cardLayer);
        addSvg("rect", { class: "shell", width: node.w, height: node.h }, g);
        addSvg("rect", { class: "bar", width: 6, height: node.h, fill: colors[node.kind] }, g);
        const title = addSvg("text", { class: "card-title", x: 17, y: 27 }, g);
        title.textContent = node.title;
        node.body.forEach((line, index) => {
          const text = addSvg("text", { class: "card-body", x: 17, y: 53 + index * 17 }, g);
          text.textContent = line;
        });
        const pillW = Math.max(60, Math.min(node.w - 28, node.tag.length * 6.2 + 18));
        addSvg("rect", { class: "pill-bg", x: 17, y: node.h - 26, width: pillW, height: 20 }, g);
        const pill = addSvg("text", { class: "pill", x: 25, y: node.h - 11 }, g);
        pill.textContent = node.tag;
      });
    </script>
  </body>
</html>
