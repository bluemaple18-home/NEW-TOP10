[project]
name = "tw-top10"
version = "0.1.0"
description = "台股波段預測與自動化排名系統"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "duckdb>=0.9",
    "fastapi>=0.115",
    "finmind>=1.2",
    "httpx>=0.27",
    "lightgbm>=4.0",
    "lxml>=4.9",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
    "shap>=0.41",
    "ta>=0.10",
    "tqdm>=4.65",
    "uvicorn>=0.30",
    "yfinance>=0.2,<1.0",
]

[dependency-groups]
training = [
    "mlflow>=2.8",
    "optuna>=3.5",
    "xgboost>=2.0",
]
reporting = [
    "mplfinance>=0.12.10b0",
    "pillow>=10.0",
    "plotly>=5.18",
    "vectorbt>=0.25",
]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
